name = "kiosk-for-holded"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
# Variables set outside this file (for example ALLOWED_ORIGINS on a split Pages + Worker
# install) survive deploys that do not pass them.
keep_vars = true

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker runs for every request so the optional kiosk password also covers the page and assets.
run_worker_first = true

# No id on purpose: wrangler deploy and the Deploy to Cloudflare button create the namespace
# and later deploys reuse it. It holds the key that seals Holded API keys.
[[kv_namespaces]]
binding = "KIOSK_KEYS"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 120
period = 60
